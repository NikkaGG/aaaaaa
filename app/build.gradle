plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.cameraoverride'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.cameraoverride"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // API-заглушка Xposed/LSPosed, нужна только на этапе компиляции —
    // на устройстве реальная реализация подставляется фреймворком LSPosed
    compileOnly 'de.robv.android.xposed:api:82'
}
